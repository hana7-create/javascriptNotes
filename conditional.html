<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Conditionals & Logic</title>
</head>
<body>
    <h1>Conditionals & Logic (If/Else, Switch, Ternary)</h1>

    <script>
        // Logical AND (&&) check
        let age = 18;
        let country = 'kenya';

        if (age >= 18 && country === 'kenya') {
            console.log('You can vote');
        } else {
            console.log('You cannot vote');
        }

        // Else If Chain (Grading System)
        let score = 80;

        if (score >= 90 && score <= 100) {
            console.log('Grade: A');
        } else if (score >= 80 && score < 90) {
            console.log('Grade: B');
        } else if (score >= 70 && score < 80) {
            console.log('Grade: C');
        } else if (score >= 60 && score < 70) {
            console.log('Grade: D');
        } else {
            console.log('FAIL!!!');
        }

        // Switch Statement (Grouping Multiple Cases)
        let day = 'Monday';

        switch (day) {
            case 'Monday':
            case 'Tuesday':
            case 'Wednesday':
            case 'Thursday':
            case 'Friday':
                console.log('I wake up early');
                break;
            case 'Saturday':
            case 'Sunday':
                console.log('I wake up late');
                break;
            default:
                console.log('Not a valid day');
                break;
        }

        // Ternary Operator (Shorthand for simple if/else)
        let isRaining = true;
        let action = isRaining ? 'take an umbrella' : 'no need for an umbrella';
        console.log(action);

        // Uniform Check Chain
        let schoolDay = 'monday';

        if (schoolDay === 'monday') {
            console.log('Wear Monday uniform');
        } else if (schoolDay === 'tuesday') {
            console.log('Wear Tuesday uniform');
        } else if (schoolDay === 'wednesday') {
            console.log('Wear Wednesday uniform');
        } else if (schoolDay === 'thursday') {
            console.log('Wear Thursday uniform');
        } else if (schoolDay === 'friday') {
            console.log('Wear Friday uniform');
        } else {
            console.log('Wear normal clothes');
        }

        // Nested Conditionals
        let fee = 30;
        let hasId = true;

        if (fee <= 30) {
            if (hasId) {
                console.log('Exam access granted');
            } else {
                console.log('Bring your ID');
            }
        } else {
            console.log('Fee too high');
        }
    </script>
</body>
</html>
