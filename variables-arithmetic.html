<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Variables & Arithmetic</title>
</head>
<body>
    <h1>Variables & Basic Arithmetic</h1>

    <script>
        // Declarations
        let a = 5;
        let b = 11;
        let c = 4;
        const pi = 3.14159; // const cannot be reassigned

        // Basic arithmetic
        console.log("Sum:", a + b + c);
        console.log("Difference:", a - b);
        console.log("Product:", 20 * 5);
        console.log("Division:", 100 / 5);

        // Modulus (Remainder after division)
        console.log("Remainder of 40/3:", 40 % 3);

        // Exponents (Power)
        console.log("2 to the power 4:", 2 ** 4);
        console.log("3 to the power 4:", 3 ** 4);

        // Compound assignment shortcuts
        let age = 33;
        age += 3; // Equivalent to: age = age + 3
        console.log("Age after += 3:", age);

        let score = 50;
        score -= 4; // Equivalent to: score = score - 4
        console.log("Score after -= 4:", score);

        let fruits = 60;
        fruits *= 7;
        console.log("Fruits after *= 7:", fruits);

        let money = 50;
        money /= 5;
        console.log("Money after /= 5:", money);

        let people = 73;
        people %= 5;
        console.log("People after %= 5:", people);
    </script>
</body>
</html>
