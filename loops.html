<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loops</title>
</head>
<body>
    <h1>Loops (For, While, Do...While)</h1>

    <script>
        // 1. FOR LOOPS (Best when you know exact iterations)
        console.log("--- Counting Up (1 to 5) ---");
        for (let i = 1; i <= 5; i++) {
            console.log(i);
        }

        console.log("--- Counting Down (5 to 1) ---");
        for (let i = 5; i >= 1; i--) {
            console.log(i);
        }

        // 2. WHILE LOOPS (Runs as long as condition remains true)
        console.log("--- While Loop Countdown ---");
        let number = 10;
        while (number >= 2) {
            console.log(number);
            number--;
        }

        // 3. DO...WHILE LOOPS (Executes AT LEAST ONCE before checking condition)
        console.log("--- Do-While Loop ---");
        let score = 1;
        do {
            console.log("Score:", score);
            score += 2;
        } while (score <= 10);
    </script>
</body>
</html>
